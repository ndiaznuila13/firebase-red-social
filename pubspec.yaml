name: clase23_firebase_demo
description: "App de ejemplo para la Clase 23 (Semana 8): configuración de Firebase con FlutterFire, autenticación por correo/contraseña y lectura/escritura en Cloud Firestore."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  cupertino_icons: ^1.0.6
  firebase_storage: ^12.4.10
  video_player: ^2.14.1
  image_picker: ^1.2.4
  google_mlkit_face_detection: ^0.15.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
